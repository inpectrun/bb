<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>One More Month</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400..700&family=Manrope:wght@400;500;700&family=Caveat:wght@600&display=swap">
<style>
  :root{
    --ground:#FBEAE2;
    --surface:#FFF9F4;
    --ink:#5C2A38;
    --ink-soft:#8A5563;
    --rose:#D8697E;
    --rose-deep:#B84F66;
    --gold:#E8AE5C;
    --line:#F0D2C8;
    --shadow: 0 18px 40px -18px rgba(92,42,56,0.35);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --ground:#2C1620;
      --surface:#3A1E2A;
      --ink:#F7E3E8;
      --ink-soft:#D9AFB9;
      --rose:#E98CA0;
      --rose-deep:#F2A5B5;
      --gold:#F0C27E;
      --line:#54293A;
      --shadow: 0 18px 40px -18px rgba(0,0,0,0.55);
    }
  }
  :root[data-theme="dark"]{
    --ground:#2C1620;
    --surface:#3A1E2A;
    --ink:#F7E3E8;
    --ink-soft:#D9AFB9;
    --rose:#E98CA0;
    --rose-deep:#F2A5B5;
    --gold:#F0C27E;
    --line:#54293A;
    --shadow: 0 18px 40px -18px rgba(0,0,0,0.55);
  }

  *{box-sizing:border-box;}
  html, body{ background:var(--ground); }
  body{
    margin:0;
    color:var(--ink);
    font-family:'Manrope', ui-sans-serif, system-ui, sans-serif;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
    overflow-x:hidden;
    padding:48px 20px;
  }

  #sparkles{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    pointer-events:none;
    z-index:0;
  }

  .stage{
    position:relative;
    z-index:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:28px;
    text-align:center;
    max-width:560px;
  }

  .eyebrow{
    font-family:'Caveat', cursive;
    font-size:1.5rem;
    font-weight:600;
    color:var(--rose-deep);
    letter-spacing:0.02em;
  }

  h1{
    font-family:'Fraunces', Georgia, serif;
    font-optical-sizing:auto;
    font-weight:600;
    font-size:clamp(2.6rem, 7vw, 4.4rem);
    line-height:1.02;
    margin:0;
    color:var(--ink);
    text-wrap:balance;
  }

  h1 em{
    font-style:italic;
    font-weight:400;
    color:var(--rose-deep);
  }

  .ribbon{
    display:inline-block;
    font-size:1em;
    transform:translateY(0.05em);
  }

  .sub{
    font-size:1.05rem;
    color:var(--ink-soft);
    max-width:38ch;
    line-height:1.55;
    margin:0;
  }

  .cta-wrap{
    position:relative;
    display:inline-flex;
    margin-top:8px;
  }

  .cta{
    appearance:none;
    border:none;
    cursor:pointer;
    font-family:'Manrope', sans-serif;
    font-weight:700;
    font-size:1.05rem;
    color:var(--surface);
    background:linear-gradient(135deg, var(--rose), var(--rose-deep));
    padding:18px 38px;
    border-radius:999px;
    box-shadow:var(--shadow);
    letter-spacing:0.01em;
    transition:transform 0.18s ease, box-shadow 0.18s ease;
  }
  .cta:hover{
    transform:translateY(-2px) scale(1.02);
    box-shadow:0 22px 46px -16px rgba(184,79,102,0.55);
  }
  .cta:active{ transform:translateY(0) scale(0.99); }
  .cta:focus-visible{
    outline:3px solid var(--gold);
    outline-offset:3px;
  }

  .pointer{
    position:absolute;
    right:-92px;
    bottom:-26px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:2px;
    pointer-events:none;
    animation:point 1.6s ease-in-out infinite;
  }
  .pointer span{
    font-family:'Caveat', cursive;
    font-weight:600;
    font-size:1.35rem;
    color:var(--rose-deep);
    white-space:nowrap;
    transform:rotate(6deg);
  }
  .pointer svg{ width:54px; height:54px; }

  @keyframes point{
    0%, 100% { transform: translate(0, 0) rotate(0deg); }
    50% { transform: translate(-4px, -6px) rotate(-4deg); }
  }

  .count{
    display:flex;
    gap:6px;
    align-items:baseline;
    color:var(--ink-soft);
    font-size:0.9rem;
  }
  .count b{
    font-family:'Fraunces', serif;
    font-size:1.15rem;
    color:var(--rose-deep);
    font-weight:600;
  }

  @media (max-width: 480px){
    .pointer{
      right:auto;
      left:50%;
      bottom:-58px;
      transform:translateX(-50%);
      flex-direction:row-reverse;
    }
    .pointer span{ transform:rotate(0deg); }
    @keyframes point{
      0%, 100% { transform: translateX(-50%) translateY(0); }
      50% { transform: translateX(-50%) translateY(-6px); }
    }
  }

  @media (prefers-reduced-motion: reduce){
    .pointer{ animation:none; }
    .cta{ transition:none; }
  }
</style>
</head>
<body>

<canvas id="sparkles"></canvas>

<main class="stage">
  <p class="eyebrow">nine months in, still counting</p>
  <h1>Happy<br><em>Monthsary</em> <span class="ribbon">🎀</span></h1>
  <p class="sub">Another month stacked onto the pile. Tap below and let's mark this one properly.</p>

  <div class="cta-wrap">
    <button class="cta" id="celebrate">Celebrate With Me 🎉</button>
    <div class="pointer" aria-hidden="true">
      <span>click me!</span>
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M6 4C6 10 8 15 13 18M13 18L9.5 16.5M13 18L11.8 21.3" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color:var(--rose-deep)"/>
      </svg>
    </div>
  </div>

  <p class="count">day <b id="dayCount">274</b> and every one's been worth it</p>
</main>

<script>
  (function(){
    var start = new Date('2025-12-09');
    var now = new Date();
    var days = Math.max(1, Math.round((now - start) / 86400000));
    document.getElementById('dayCount').textContent = days;
  })();

  (function(){
    var canvas = document.getElementById('sparkles');
    var ctx = canvas.getContext('2d');
    var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    var DPR = Math.min(window.devicePixelRatio || 1, 2);

    function resize(){
      canvas.width = window.innerWidth * DPR;
      canvas.height = window.innerHeight * DPR;
      canvas.style.width = window.innerWidth + 'px';
      canvas.style.height = window.innerHeight + 'px';
    }
    resize();
    window.addEventListener('resize', resize);

    var shapes = ['heart', 'spark'];
    var particles = [];
    var count = Math.round((window.innerWidth * window.innerHeight) / 42000);
    for(var i=0;i<count;i++){
      particles.push({
        x: Math.random()*window.innerWidth,
        y: Math.random()*window.innerHeight,
        r: 4 + Math.random()*7,
        speed: 0.12 + Math.random()*0.28,
        drift: (Math.random()-0.5)*0.3,
        alpha: 0.15 + Math.random()*0.35,
        kind: shapes[Math.random() < 0.35 ? 0 : 1],
        angle: Math.random()*Math.PI*2
      });
    }

    function heart(ctx, x, y, r){
      ctx.beginPath();
      ctx.moveTo(x, y + r*0.3);
      ctx.bezierCurveTo(x - r, y - r*0.6, x - r*1.6, y + r*0.4, x, y + r*1.3);
      ctx.bezierCurveTo(x + r*1.6, y + r*0.4, x + r, y - r*0.6, x, y + r*0.3);
      ctx.closePath();
      ctx.fill();
    }

    function spark(ctx, x, y, r, angle){
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(angle);
      ctx.beginPath();
      ctx.moveTo(0, -r); ctx.lineTo(r*0.2, -r*0.2);
      ctx.lineTo(r, 0); ctx.lineTo(r*0.2, r*0.2);
      ctx.lineTo(0, r); ctx.lineTo(-r*0.2, r*0.2);
      ctx.lineTo(-r, 0); ctx.lineTo(-r*0.2, -r*0.2);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }

    var roseColor = getComputedStyle(document.documentElement).getPropertyValue('--rose-deep').trim() || '#B84F66';
    var goldColor = getComputedStyle(document.documentElement).getPropertyValue('--gold').trim() || '#E8AE5C';

    function draw(){
      ctx.setTransform(DPR,0,0,DPR,0,0);
      ctx.clearRect(0,0,window.innerWidth, window.innerHeight);
      for(var i=0;i<particles.length;i++){
        var p = particles[i];
        ctx.globalAlpha = p.alpha;
        ctx.fillStyle = p.kind === 'heart' ? roseColor : goldColor;
        if(p.kind === 'heart') heart(ctx, p.x, p.y, p.r);
        else spark(ctx, p.x, p.y, p.r*0.8, p.angle);
        if(!reduce){
          p.y -= p.speed;
          p.x += p.drift;
          p.angle += 0.01;
          if(p.y < -20){ p.y = window.innerHeight + 20; p.x = Math.random()*window.innerWidth; }
        }
      }
      ctx.globalAlpha = 1;
      if(!reduce) requestAnimationFrame(draw);
    }
    draw();
  })();

  document.getElementById('celebrate').addEventListener('click', function(){
    this.textContent = "Yay! 🥳";
    this.style.background = 'linear-gradient(135deg, var(--gold), var(--rose-deep))';
  });
</script>
</body>
</html>
